spring.application.name=SpringSecurity
# server.port=8080 (default port, by client and server)
#DataBase
#The port 5332 is the connection between the host(5332) and the container that has the database(5432)
spring.datasource.url=jdbc:postgresql://localhost:5332/<name_database>  
spring.datasource.username=<user>
spring.datasource.password=<password>

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update 
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true 